:root {
  --bg:      #080d18;
  --surface: #0f172a;
  --card:    #162033;
  --card2:   #1e2d47;
  --border:  #263352;
  --accent:  #3b82f6;
  --accent2: #8b5cf6;
  --accent3: #06b6d4;
  --text:    #ffffff;
  --muted:   #cbd5e1;
  --dim:     #94a3b8;
  --pos:     #22c55e;
  --neg:     #ef4444;
  --neu:     #f59e0b;
  --r:       12px;
  --r-sm:    8px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Inter','Segoe UI',system-ui,sans-serif;font-size:14px;line-height:1.6}

/* ── loading / error ── */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:20px;color:var(--muted)}
.spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.error-screen{padding:60px 40px;text-align:center}
.error-screen h2{color:var(--neg);margin-bottom:16px;font-size:1.4rem}
.error-screen code{background:var(--card);padding:4px 10px;border-radius:6px;color:var(--accent3);font-family:monospace}

/* ── i18n switcher ── */
.i18n-bar{display:flex;gap:6px;align-items:center;padding:8px 36px;background:var(--surface);border-bottom:1px solid var(--border);flex-wrap:wrap}
.i18n-label{font-size:.72rem;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin-right:4px}
.lang-btn{background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--muted);font-size:.82rem;padding:4px 11px;border-radius:999px;cursor:pointer;transition:background .15s,border-color .15s,color .15s;white-space:nowrap}
.lang-btn:hover{background:rgba(255,255,255,.1);color:#fff}
.lang-btn.active{background:rgba(59,130,246,.2);border-color:rgba(59,130,246,.6);color:#93c5fd}

/* ── hero ── */
.hero{background:linear-gradient(135deg,#0a1628 0%,#150a2e 50%,#071220 100%);border-bottom:1px solid var(--border);padding:40px 36px 32px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 70% 90% at 85% 40%,rgba(59,130,246,.1),transparent),radial-gradient(ellipse 40% 60% at 15% 60%,rgba(139,92,246,.07),transparent);pointer-events:none}
.hero h1{font-size:clamp(1.8rem,4vw,2.6rem);font-weight:800;letter-spacing:-.03em;background:linear-gradient(90deg,#60a5fa 0%,#a78bfa 50%,#22d3ee 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
.hero-sub{color:var(--muted);font-size:.95rem;margin-bottom:28px}
.hero-meta{color:var(--dim);font-size:.78rem;margin-top:8px}
.hero-intro{color:var(--muted);font-size:.87rem;line-height:1.65;margin-top:14px;border-top:1px solid rgba(255,255,255,.06);padding-top:14px;max-width:860px}

/* ── stat cards ── */
.stats{display:flex;flex-wrap:wrap;gap:14px;margin-top:4px}
.stat{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.08);border-radius:var(--r);padding:16px 22px;min-width:140px;backdrop-filter:blur(12px);transition:transform .2s,border-color .2s}
.stat:hover{transform:translateY(-2px);border-color:rgba(59,130,246,.4)}
.stat .s-label{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.stat .s-value{font-size:1.8rem;font-weight:700;color:#fff;line-height:1.1;margin:4px 0}
.stat .s-sub{font-size:.75rem;color:var(--muted)}

/* ── tabs ── */
.tab-nav{display:flex;gap:4px;padding:14px 36px 0;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;flex-wrap:wrap}
.tab-btn{background:none;border:none;color:var(--muted);font-size:.9rem;font-weight:500;padding:10px 18px;cursor:pointer;border-bottom:2px solid transparent;transition:color .15s,border-color .15s;border-radius:var(--r-sm) var(--r-sm) 0 0;white-space:nowrap}
.tab-btn:hover{color:#fff}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}

/* ── tab content ── */
.tab-content{padding:28px 36px;max-width:1800px;margin:0 auto}

/* ── charts ── */
.charts-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:24px;margin-bottom:28px}
.charts-3pie{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-bottom:24px}
.chart-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:24px;position:relative}
.chart-card h3{font-size:.85rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin-bottom:16px}
.chart-card canvas{max-height:480px;width:100%}
.chart-card canvas.chart-tall{height:640px!important;max-height:640px!important}
.chart-wide{grid-column:1/-1}
.chart-caption{margin-top:12px;font-size:.82rem;color:#cbd5e1;line-height:1.6;border-top:1px solid rgba(38,51,82,.5);padding-top:10px}

/* ── axis labels via CSS on chart titles ── */
.chart-x-label{text-align:center;font-size:.7rem;color:var(--dim);margin-top:2px}
.chart-y-label{position:absolute;left:8px;top:50%;transform:rotate(-90deg) translateX(-50%);font-size:.68rem;color:var(--dim);white-space:nowrap;transform-origin:0 50%}

/* ── stat badge in corner ── */
.chart-corner-stat{position:absolute;top:20px;right:20px;font-size:.7rem;font-weight:700;color:#93c5fd;background:rgba(59,130,246,.15);border:1px solid rgba(59,130,246,.3);border-radius:6px;padding:3px 8px;letter-spacing:.06em}

/* ── controls ── */
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px;padding:14px 18px;background:var(--card);border:1px solid var(--border);border-radius:var(--r)}
.controls input,.controls select{background:var(--surface);border:1px solid var(--border);color:#fff;border-radius:var(--r-sm);padding:8px 12px;font-size:.87rem;outline:none;transition:border-color .2s}
.controls input{flex:1;min-width:200px}
.controls input::placeholder{color:var(--dim)}
.controls input:focus,.controls select:focus{border-color:var(--accent)}
.controls select option{background:var(--surface);color:#fff}
label.ctrl-label{font-size:.78rem;color:var(--muted);white-space:nowrap}
.drill-banner{display:flex;align-items:center;gap:12px;background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.35);border-radius:8px;padding:10px 16px;margin-bottom:12px;font-size:.87rem;color:#93c5fd}
.drill-clear{background:rgba(59,130,246,.2);border:1px solid rgba(59,130,246,.4);color:#93c5fd;padding:4px 10px;border-radius:6px;cursor:pointer;font-size:.8rem;margin-left:auto;white-space:nowrap}
.drill-clear:hover{background:rgba(59,130,246,.35);color:#fff}
.result-count{color:var(--muted);font-size:.82rem;margin-bottom:12px;padding-left:2px}

/* ── articles table ── */
.articles-table-wrap{overflow-x:auto}
table.art-table{width:100%;border-collapse:collapse;font-size:.84rem}
table.art-table th{text-align:left;padding:10px 14px;background:var(--card2);color:#fff;font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none}
table.art-table th:hover{color:var(--accent)}
table.art-table td{padding:10px 14px;border-bottom:1px solid rgba(38,51,82,.5);vertical-align:top;max-width:340px;color:#fff}
table.art-table tr:hover td{background:rgba(255,255,255,.025)}
.art-title a{color:#fff;text-decoration:none;font-weight:500;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.art-title a:hover{color:var(--accent)}
.art-desc{color:var(--muted);font-size:.78rem;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.art-pub{color:var(--muted);font-size:.78rem}

/* ── badges ── */
.badge{display:inline-block;padding:2px 7px;border-radius:999px;font-size:.68rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.b-google     {background:rgba(59,130,246,.2);color:#93c5fd}
.b-talkwalker {background:rgba(139,92,246,.2);color:#c4b5fd}
.b-news       {background:rgba(34,197,94,.15);color:#86efac}
.b-web        {background:rgba(245,158,11,.15);color:#fcd34d}
.b-video      {background:rgba(239,68,68,.15);color:#fca5a5}
.b-social     {background:rgba(6,182,212,.15);color:#67e8f9}
.b-scientific {background:rgba(168,85,247,.2);color:#d8b4fe}
.b-press_release{background:rgba(16,185,129,.15);color:#6ee7b7}
.b-blog       {background:rgba(249,115,22,.15);color:#fdba74}
.b-other      {background:rgba(100,116,139,.15);color:#cbd5e1}

/* ── sentiment ── */
.sent{display:inline-flex;align-items:center;gap:4px;font-size:.78rem;font-weight:600;padding:2px 7px;border-radius:6px;white-space:nowrap}
.sent-pos{background:rgba(34,197,94,.15);color:var(--pos)}
.sent-neg{background:rgba(239,68,68,.15);color:var(--neg)}
.sent-neu{background:rgba(245,158,11,.15);color:var(--neu)}

/* ── quality dots ── */
.q-pips{display:flex;gap:2px;align-items:center}
.q-pip{width:7px;height:7px;border-radius:2px;background:var(--border)}
.q-pip.on{background:var(--accent)}

/* ── pivot ── */
.pivot-controls{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin-bottom:20px;padding:16px 18px;background:var(--card);border:1px solid var(--border);border-radius:var(--r)}
.pivot-controls select{background:var(--surface);border:1px solid var(--border);color:#fff;border-radius:var(--r-sm);padding:8px 14px;font-size:.88rem;outline:none;cursor:pointer}
.pivot-controls select:focus{border-color:var(--accent)}
.pivot-controls label{font-size:.78rem;color:var(--muted)}
.pivot-wrapper{overflow:auto;border:1px solid var(--border);border-radius:var(--r)}
table.pivot-table{border-collapse:collapse;font-size:.8rem;width:100%}
table.pivot-table th{padding:10px 14px;text-align:center;background:var(--card2);border:1px solid var(--border);color:#fff;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
table.pivot-table th.corner{background:var(--surface)}
table.pivot-table th.row-header{text-align:left;background:var(--card);color:#fff;font-weight:600}
table.pivot-table td{padding:8px 12px;text-align:center;border:1px solid rgba(38,51,82,.4);font-weight:500;color:#fff;transition:background .1s}
table.pivot-table td.empty{color:var(--border)}
/* true pastel solid backgrounds — light cells, dark text */
table.pivot-table td.hot  {background:#FFD5A0;color:#7c2d12}
table.pivot-table td.warm {background:#A8D8FF;color:#0c2c4e}
table.pivot-table td.cool {background:#D4BBFF;color:#2e1065}
table.pivot-table td.pos  {background:#A0FFD5;color:#052e16}
table.pivot-table td.neg  {background:#FFB3C1;color:#4c0519}
table.pivot-table td.neu  {background:#FFF3A0;color:#422006}
table.pivot-table .row-total,.col-total-row{font-weight:700;color:#fff;background:var(--card)!important}
table.pivot-table .col-total-row th,.col-total-row td{border-top:2px solid var(--border)}
.pivot-pub-link{color:#93c5fd;text-decoration:none}
.pivot-pub-link:hover{color:#fff;text-decoration:underline}

/* ── word cloud ── */
#wordcloud-canvas{width:100%;height:520px;display:block}
.wordcloud-caption{margin-top:14px;font-size:.75rem;color:#cbd5e1;line-height:1.6;border-top:1px solid rgba(38,51,82,.5);padding-top:12px}

/* ── Q&A chat ── */
.qa-lang-note{font-size:.78rem;color:var(--dim);background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.2);border-radius:var(--r-sm);padding:8px 14px;margin-bottom:10px}
.qa-chat-wrap{display:flex;flex-direction:column;height:520px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:24px}
.qa-chat-log{flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;justify-content:flex-end;gap:12px}
.qa-input-bar{display:flex;gap:10px;padding:12px 16px;border-top:1px solid var(--border);background:var(--surface)}
.qa-input-bar input{flex:1;background:var(--card2);border:1px solid var(--border);color:#fff;border-radius:var(--r-sm);padding:10px 14px;font-size:.9rem;outline:none}
.qa-input-bar input:focus{border-color:var(--accent)}
.qa-input-bar button{background:var(--accent);color:#fff;border:none;border-radius:var(--r-sm);padding:10px 20px;font-size:.9rem;font-weight:600;cursor:pointer;white-space:nowrap;transition:background .15s}
.qa-input-bar button:hover{background:#2563eb}
.qa-bubble{max-width:82%;display:flex;flex-direction:column}
.qa-bubble.bot{align-self:flex-start}
.qa-bubble.user{align-self:flex-end}
.qa-bubble-text{padding:11px 16px;border-radius:16px;font-size:.9rem;line-height:1.6;color:#fff}
.qa-bubble.bot .qa-bubble-text{background:var(--surface);border:1px solid var(--border);border-bottom-left-radius:4px}
.qa-bubble.user .qa-bubble-text{background:var(--accent);border-bottom-right-radius:4px}
.qa-cards{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.qa-art-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.qa-art-title{color:#93c5fd;font-size:.88rem;font-weight:600;text-decoration:none;display:block;margin-bottom:4px}
.qa-art-title:hover{text-decoration:underline}
.qa-art-meta{font-size:.78rem;color:var(--dim);margin-bottom:4px}
.qa-art-desc{font-size:.8rem;color:var(--muted);line-height:1.5}
.qa-more{font-size:.78rem;color:var(--dim);margin-top:6px;padding-left:4px;font-style:italic}
.qa-box{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:24px;margin-bottom:24px}
.qa-box h3{font-size:1rem;font-weight:600;color:#fff;margin-bottom:12px}
.claude-btn{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,#7c3aed,#3b82f6);color:#fff;border:none;border-radius:var(--r-sm);padding:12px 24px;font-size:.95rem;font-weight:600;cursor:pointer;text-decoration:none;transition:opacity .2s}
.claude-btn:hover{opacity:.85}

/* ── about/readme ── */
.readme{max-width:860px;line-height:1.8;color:#fff}
.readme h2{font-size:1.3rem;font-weight:700;margin:28px 0 12px;color:#fff}
.readme h3{font-size:1.05rem;font-weight:600;margin:20px 0 8px;color:var(--muted)}
.readme p{color:var(--muted);margin-bottom:12px}
.readme ul{color:var(--muted);padding-left:20px;margin-bottom:12px}
.readme li{margin-bottom:4px}
.readme a{color:#93c5fd;text-decoration:none}
.readme a:hover{text-decoration:underline}
.readme code{background:var(--card2);color:var(--accent3);padding:2px 6px;border-radius:4px;font-family:monospace;font-size:.85em}
.readme pre{background:var(--card);border:1px solid var(--border);border-radius:var(--r-sm);padding:16px;overflow-x:auto;margin:12px 0}
.readme pre code{background:none;padding:0;color:var(--muted);font-size:.82rem;font-family:'Fira Code','Courier New',monospace}
.dl-btn{display:inline-flex;align-items:center;gap:8px;background:var(--card2);border:1px solid var(--border);color:#fff;border-radius:var(--r-sm);padding:10px 18px;font-size:.88rem;font-weight:600;cursor:pointer;text-decoration:none;transition:border-color .2s}
.dl-btn:hover{border-color:var(--accent)}
.code-link-box{display:flex;align-items:center;gap:14px;background:var(--card2);border:1px solid rgba(59,130,246,.35);border-radius:var(--r);padding:16px 22px;margin-top:28px;text-decoration:none;color:#fff;transition:border-color .2s,background .2s;cursor:pointer;max-width:360px}
.code-link-box:hover{border-color:rgba(59,130,246,.7);background:rgba(59,130,246,.07);text-decoration:none}
.code-link-icon{font-size:1.5rem;color:#93c5fd;flex-shrink:0;font-family:monospace}
.code-link-text{display:flex;flex-direction:column;gap:2px}
.code-link-text strong{font-size:.95rem;font-weight:700;color:#fff}
.code-link-text small{font-size:.75rem;color:var(--dim)}
.code-link-arrow{margin-left:auto;font-size:1.25rem;color:#93c5fd;flex-shrink:0}
.back-link{display:inline-flex;align-items:center;gap:6px;color:#93c5fd;font-size:.88rem;text-decoration:none;margin-bottom:20px;opacity:.85;transition:opacity .15s}
.back-link:hover{opacity:1;text-decoration:none}
details.code-block{background:var(--card);border:1px solid var(--border);border-radius:var(--r-sm);margin:10px 0;overflow:hidden}
details.code-block summary{padding:13px 18px;font-size:.9rem;font-weight:600;color:#fff;cursor:pointer;display:flex;align-items:center;gap:12px;user-select:none;list-style:none}
details.code-block summary::-webkit-details-marker{display:none}
details.code-block summary::before{content:"▶";font-size:.7rem;color:var(--accent);transition:transform .2s;flex-shrink:0}
details.code-block[open] summary::before{transform:rotate(90deg)}
.code-filename{color:#93c5fd;font-family:monospace}
.code-hint{color:var(--dim);font-size:.78rem;font-weight:400;margin-left:4px}
details.code-block pre{margin:0;border-radius:0;border-top:1px solid var(--border);border-left:none;border-right:none;border-bottom:none}

/* ── map ── */
.map-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:24px;margin-bottom:24px}
.map-card h3{font-size:.78rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin-bottom:16px}
.map-controls{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.map-toggle{background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--muted);font-size:.82rem;padding:5px 14px;border-radius:999px;cursor:pointer;transition:background .15s,color .15s}
.map-toggle.active{background:rgba(59,130,246,.2);border-color:rgba(59,130,246,.5);color:#93c5fd}
#map-canvas{width:100%;display:block;border-radius:8px;cursor:crosshair}
.map-tooltip{position:fixed;background:rgba(15,23,42,.95);border:1px solid var(--border);border-radius:8px;padding:8px 14px;font-size:.82rem;color:#fff;pointer-events:none;z-index:1000;display:none}
.map-caption{margin-top:12px;font-size:.75rem;color:#cbd5e1;line-height:1.55;border-top:1px solid rgba(38,51,82,.5);padding-top:10px}

/* ── footer ── */
.site-footer{background:var(--surface);border-top:1px solid var(--border);padding:20px 36px;text-align:center;font-size:.75rem;color:var(--dim);letter-spacing:.06em;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
.site-footer a{color:#93c5fd;text-decoration:none}
.site-footer a:hover{text-decoration:underline}
.footer-sep{color:var(--border);margin:0 4px}

/* ── scrollbar ── */
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--dim)}

@media(max-width:900px){
  .charts-grid,.charts-3pie{grid-template-columns:1fr}
  .hero,.tab-content{padding:20px 18px}
  .tab-nav{padding:10px 18px 0}
  .i18n-bar{padding:8px 18px}
  .site-footer{padding:16px 18px}
}
`}const d2={eng:"🇺🇸",spa:"🇪🇸",fra:"🇫🇷",por:"🇧🇷",ron:"🇷🇴",deu:"🇩🇪",ita:"🇮🇹",ind:"🇮🇩",vie:"🇻🇳",tur:"🇹🇷",nld:"🇳🇱",pol:"🇵🇱",rus:"🇷🇺",ara:"🇸🇦",zho:"🇨🇳",cmn:"🇨🇳",jpn:"🇯🇵",kor:"🇰🇷"},u2={eng:"English",spa:"Spanish",fra:"French",por:"Portuguese",ron:"Romanian",deu:"German",ita:"Italian",ind:"Indonesian",vie:"Vietnamese",tur:"Turkish",nld:"Dutch",pol:"Polish",rus:"Russian",ara:"Arabic",zho:"Chinese",cmn:"Mandarin",jpn:"Japanese",kor:"Korean",und:"Unknown"},oo={eng:{timeline:"Blue bars = total monthly alert count. Orange line = articles from trusted science/space sources on a second axis. Spikes in trusted coverage often mark key orbital calculation updates.",sentiment:"Sentiment is assessed using a keyword-based scoring method (not AI). Words associated with scientific opportunity, discovery, and missions push the score toward +1; threat language, danger, and impact-risk terminology push toward −1.<br><br><strong>Positive (score > 0.1):</strong> Articles emphasizing opportunity or discovery — mission announcements (ESA RAMSES, OSIRIS-APEX), scientific findings, sample return planning.<br><strong>Negative (score < −0.1):</strong> Articles leading with danger or threat language — impact probability updates, close-approach warnings, doomsday framing.<br><strong>Neutral (−0.1 to 0.1):</strong> Descriptive factual reporting — orbital data, observatory confirmations, general educational content. The majority of coverage falls here.<br><br>The <strong>Avg Sentiment</strong> figure in the dashboard header is the mean of all article scores. On a −1 to +1 scale, values between −0.1 and +0.1 are neutral. The corpus average of <strong>0.07</strong> sits firmly in neutral territory with a faint positive lean — factual science reporting and mission-discovery articles marginally outnumber threat-focused ones. This is a healthy signal: the media covers Apophis primarily as a scientific subject, not a doomsday threat.",source:"Data collected since <strong>April 2, 2024</strong> (first captured alert) via two parallel RSS monitoring pipelines.<br><br><strong>Google Alerts:</strong> 1,591 alerts → 5,960 articles. Keyword-triggered RSS monitoring of the open web and major news outlets.<br><strong>Talkwalker:</strong> 686 alerts → 22,990 articles. Broader social media and global news monitoring, producing higher per-alert article counts.<br><br>Alert keywords: <em>Apophis</em> · <em>Asteroid Apophis</em> · <em>99942 Apophis</em>.",nested:"Outer ring = source category. Inner ring = article type within each category.",publishers:"Log scale on X axis — X (Twitter) alone accounts for ~23,000 articles and would collapse all other bars on a linear scale.",language:"Language detected automatically using <strong>franc-min</strong>, a trigram-based statistical library (not AI) that compares character-trigram frequencies against reference profiles per language. Short articles (< 50 words) may be misclassified.<br><br>The dataset contains <strong>60 unique languages</strong>. This chart shows the top 12, covering 26,817 articles (92.6% of all content). The remaining 48 languages account for 2,133 articles (7.4%).<br><br><strong>Notable unlisted languages:</strong> Malay (200) · Japanese (193) · Russian (184) · Hungarian (176) · Indonesian (167) · Dutch (158) · Vietnamese (116) · Swedish (95) · Serbian (94) · Hindi (76) · Persian (71) · Bulgarian (68) · and 36 more.",density:"How many articles each alert contained. Log scale on Y reveals the full distribution — most alerts have 1–5 articles.",quality:"Heuristic 1–10 score: word count, title casing, absence of clickbait markers. Score 8–10 = substantive. Score 1–3 = brief or auto-generated.",sent_trend:"Monthly average of the keyword-based sentiment score (−1 = very negative, +1 = very positive). Each point is the mean of all articles in that month. The Y-axis is scaled to the actual data range (not ±1) to reveal variation. Green dots = net positive month (avg > 0.1); red = negative (avg < −0.1); yellow = neutral. Positive spikes correlate with mission announcements and scientific discovery news. Negative dips often follow near-miss threat coverage or impact probability updates. Most months cluster near 0 because mainstream news tends to be descriptive rather than alarmist.",variants:"'99942 Apophis' is the formal IAU designation. 'Asteroid Apophis' appears in headlines. 'Apophis' alone is casual shorthand.",science:"Coverage from NASA, ESA (RAMSES mission), JAXA, AAS, Space.com, and verified space-science outlets. ESA leads because it has an active dedicated Apophis mission."},spa:{timeline:"Barras azules = alertas mensuales totales. Línea naranja = artículos de fuentes científicas confiables en un segundo eje.",sentiment:"El sentimiento se evalúa mediante puntuación por palabras clave (no IA). Las palabras asociadas a oportunidad científica, descubrimiento y misiones empujan la puntuación hacia +1; el lenguaje de amenaza, peligro y riesgo de impacto la empuja hacia −1.<br><br><strong>Positivo (puntuación > 0.1):</strong> Artículos que enfatizan oportunidad o descubrimiento — anuncios de misiones (ESA RAMSES, OSIRIS-APEX), hallazgos científicos, planificación de retorno de muestras.<br><strong>Negativo (puntuación < −0.1):</strong> Artículos encabezados con lenguaje de peligro o amenaza — actualizaciones de probabilidad de impacto, advertencias de aproximación, marcos apocalípticos.<br><strong>Neutro (−0.1 a 0.1):</strong> Reportaje factual descriptivo — datos orbitales, confirmaciones de observatorio, contenido educativo general. La mayoría de la cobertura cae aquí.<br><br>El valor <strong>Sent. Promedio</strong> del encabezado es la media de todas las puntuaciones. En una escala de −1 a +1, los valores entre −0.1 y +0.1 son neutros. El promedio del corpus de <strong>0.07</strong> es firmemente neutral con una leve tendencia positiva — los artículos científicos y de descubrimiento superan ligeramente a los de amenaza. Una señal positiva: los medios tratan a Apophis como un sujeto científico, no como una amenaza apocalíptica.",source:"Datos recopilados desde el <strong>2 de abril de 2024</strong> (primera alerta capturada) mediante dos sistemas de monitoreo RSS en paralelo.<br><br><strong>Google Alerts:</strong> 1.591 alertas → 5.960 artículos. RSS activado por palabras clave que monitorea la web abierta y los principales medios.<br><strong>Talkwalker:</strong> 686 alertas → 22.990 artículos. Monitoreo más amplio de redes sociales y flujos de noticias globales.<br><br>Palabras clave configuradas: <em>Apophis</em> · <em>Asteroid Apophis</em> · <em>99942 Apophis</em>.",nested:"Anillo exterior = categoría de fuente. Anillo interior = tipo de artículo dentro de cada categoría.",publishers:"Escala logarítmica en eje X — X (Twitter) solo tiene ~23.000 artículos y colapsaría todas las demás barras en escala lineal.",language:"Idioma detectado automáticamente con <strong>franc-min</strong>, una biblioteca estadística basada en trigramas (no IA) que compara frecuencias de trigramas de caracteres con perfiles de referencia por idioma. Los artículos cortos (< 50 palabras) pueden clasificarse incorrectamente.<br><br>El conjunto de datos contiene <strong>60 idiomas únicos</strong>. Este gráfico muestra los 12 principales, que representan 26.817 artículos (92,6% del total). Los 48 idiomas restantes suman 2.133 artículos (7,4%).<br><br><strong>Idiomas notables no incluidos:</strong> Malayo (200) · Japonés (193) · Ruso (184) · Húngaro (176) · Indonesio (167) · Neerlandés (158) · Vietnamita (116) · Sueco (95) · Serbio (94) · Hindi (76) · Persa (71) · Búlgaro (68) · y 36 más.",density:"Cuántos artículos contenía cada alerta. La escala log revela la distribución completa.",quality:"Puntuación heurística 1–10: recuento de palabras, capitalización, ausencia de clickbait. 8–10 = sustancial. 1–3 = breve o automático.",sent_trend:"Promedio mensual del índice de sentimiento (−1 = muy negativo, +1 = muy positivo). El eje Y se escala al rango real de datos. Puntos verdes = mes neto positivo; rojos = negativo; amarillos = neutral. Los picos positivos coinciden con anuncios de misiones; los negativos con actualizaciones de riesgo de impacto.",variants:"'99942 Apophis' es la designación formal IAU. 'Asteroide Apophis' aparece en titulares.",science:"Cobertura de NASA, ESA (misión RAMSES), JAXA, AAS, Space.com y fuentes espaciales verificadas."},fra:{timeline:"Barres bleues = total mensuel des alertes. Ligne orange = articles de sources scientifiques fiables sur un second axe.",sentiment:"Le sentiment est évalué par une méthode de notation par mots-clés (pas d'IA). Les mots associés à l'opportunité scientifique, la découverte et les missions font monter le score vers +1 ; le langage de menace, de danger et de risque d'impact le fait descendre vers −1.<br><br><strong>Positif (score > 0,1) :</strong> Articles mettant l'accent sur les opportunités ou la découverte — annonces de missions (ESA RAMSES, OSIRIS-APEX), résultats scientifiques, retour d'échantillons.<br><strong>Négatif (score < −0,1) :</strong> Articles axés sur le danger ou la menace — mises à jour de probabilité d'impact, avertissements d'approche rapprochée, cadrage catastrophiste.<br><strong>Neutre (−0,1 à 0,1) :</strong> Reportage factuel descriptif — données orbitales, confirmations d'observatoires, contenu pédagogique général. La majorité de la couverture se situe ici.<br><br>La valeur <strong>Sentiment moy.</strong> affichée dans l'en-tête est la moyenne de tous les scores. Sur une échelle de −1 à +1, les valeurs entre −0,1 et +0,1 sont neutres. La moyenne du corpus de <strong>0,07</strong> est fermement neutre avec une légère tendance positive — les articles scientifiques et de découverte surpassent légèrement ceux axés sur la menace. Un signal sain : les médias traitent Apophis comme un sujet scientifique, pas comme une menace apocalyptique.",source:"Données collectées depuis le <strong>2 avril 2024</strong> (première alerte capturée) via deux pipelines RSS en parallèle.<br><br><strong>Google Alertes :</strong> 1 591 alertes → 5 960 articles. RSS déclenché par mots-clés surveillant le web ouvert et les principaux médias.<br><strong>Talkwalker :</strong> 686 alertes → 22 990 articles. Surveillance plus large des réseaux sociaux et flux d'actualités mondiaux.<br><br>Mots-clés configurés : <em>Apophis</em> · <em>Asteroid Apophis</em> · <em>99942 Apophis</em>.",nested:"Anneau extérieur = catégorie de source. Anneau intérieur = type d'article dans chaque catégorie.",publishers:"Échelle logarithmique en X — X (Twitter) représente ~23 000 articles à lui seul.",language:"Langue détectée automatiquement avec <strong>franc-min</strong>, une bibliothèque statistique à trigrammes (pas d'IA) qui compare les fréquences de trigrammes de caractères aux profils de référence par langue. Les articles courts (< 50 mots) peuvent être mal classifiés.<br><br>Le jeu de données contient <strong>60 langues uniques</strong>. Ce graphique montre les 12 premières, couvrant 26 817 articles (92,6 % du contenu total). Les 48 autres langues représentent 2 133 articles (7,4 %).<br><br><strong>Langues notables non représentées :</strong> Malais (200) · Japonais (193) · Russe (184) · Hongrois (176) · Indonésien (167) · Néerlandais (158) · Vietnamien (116) · Suédois (95) · Serbe (94) · Hindi (76) · Persan (71) · Bulgare (68) · et 36 autres.",density:"Nombre d'articles par alerte. L'échelle log révèle la distribution complète.",quality:"Score heuristique 1–10 : nombre de mots, capitalisation, absence de clickbait. 8–10 = substantiel. 1–3 = bref ou auto-généré.",sent_trend:"Moyenne mensuelle du score de sentiment (−1 = très négatif, +1 = très positif). L'axe Y est mis à l'échelle des données réelles. Points verts = mois net positif ; rouges = négatif ; jaunes = neutre. Les pics positifs coïncident avec des annonces de missions; les creux négatifs avec des mises à jour de risque d'impact.",variants:"'99942 Apophis' est la désignation officielle UAI. 'Astéroïde Apophis' apparaît dans les titres.",science:"Couverture de la NASA, ESA (mission RAMSES), JAXA, AAS, Space.com et sources spatiales vérifiées."},por:{timeline:"Barras azuis = total mensal de alertas. Linha laranja = artigos de fontes científicas confiáveis no segundo eixo.",sentiment:"O sentimento é avaliado por um método de pontuação baseado em palavras-chave (não IA). Palavras associadas à oportunidade científica, descoberta e missões empurram a pontuação para +1; linguagem de ameaça, perigo e risco de impacto empurram para −1.<br><br><strong>Positivo (pontuação > 0.1):</strong> Artigos que enfatizam oportunidade ou descoberta — anúncios de missões (ESA RAMSES, OSIRIS-APEX), descobertas científicas, planeamento de retorno de amostras.<br><strong>Negativo (pontuação < −0.1):</strong> Artigos encabeçados com linguagem de perigo ou ameaça — atualizações de probabilidade de impacto, avisos de aproximação, enquadramento apocalíptico.<br><strong>Neutro (−0.1 a 0.1):</strong> Reportagem factual descritiva — dados orbitais, confirmações de observatório, conteúdo educativo geral. A maioria da cobertura situa-se aqui.<br><br>O valor <strong>Sent. Médio</strong> no cabeçalho é a média de todas as pontuações. Numa escala de −1 a +1, os valores entre −0.1 e +0.1 são neutros. A média do corpus de <strong>0.07</strong> é firmemente neutra com uma leve tendência positiva — artigos científicos e de descoberta superam ligeiramente os de ameaça. Um sinal positivo: os média cobrem Apophis como tema científico, não como ameaça apocalíptica.",source:"Dados coletados desde <strong>2 de abril de 2024</strong> (primeiro alerta capturado) através de dois sistemas de monitoramento RSS em paralelo.<br><br><strong>Google Alertas:</strong> 1.591 alertas → 5.960 artigos. RSS ativado por palavras-chave monitorando a web aberta e os principais meios de comunicação.<br><strong>Talkwalker:</strong> 686 alertas → 22.990 artigos. Monitoramento mais amplo de redes sociais e fluxos de notícias globais.<br><br>Palavras-chave configuradas: <em>Apophis</em> · <em>Asteroid Apophis</em> · <em>99942 Apophis</em>.",nested:"Anel externo = categoria de fonte. Anel interno = tipo de artigo em cada categoria.",publishers:"Escala logarítmica no eixo X — X (Twitter) tem ~23.000 artigos sozinho.",language:"Idioma detetado automaticamente com <strong>franc-min</strong>, uma biblioteca estatística baseada em trigramas (não IA) que compara frequências de trigramas de caracteres com perfis de referência por idioma. Artigos curtos (< 50 palavras) podem ser classificados incorretamente.<br><br>O conjunto de dados contém <strong>60 idiomas únicos</strong>. Este gráfico mostra os 12 principais, que representam 26.817 artigos (92,6% do total). Os 48 idiomas restantes somam 2.133 artigos (7,4%).<br><br><strong>Idiomas notáveis não incluídos:</strong> Malaio (200) · Japonês (193) · Russo (184) · Húngaro (176) · Indonésio (167) · Neerlandês (158) · Vietnamita (116) · Sueco (95) · Sérvio (94) · Hindi (76) · Persa (71) · Búlgaro (68) · e 36 mais.",density:"Quantos artigos cada alerta continha. A escala log revela a distribuição completa.",quality:"Pontuação heurística 1–10: contagem de palavras, capitalização, ausência de clickbait. 8–10 = substancial. 1–3 = breve ou automático.",sent_trend:"Média mensal do índice de sentimento (−1 = muito negativo, +1 = muito positivo). O eixo Y é escalado ao intervalo real dos dados. Pontos verdes = mês positivo; vermelhos = negativo; amarelos = neutro. Picos positivos coincidem com anúncios de missões; quedas negativas com atualizações de risco de impacto.",variants:"'99942 Apophis' é a designação formal da IAU. 'Asteroide Apophis' aparece em manchetes.",science:"Cobertura da NASA, ESA (missão RAMSES), JAXA, AAS, Space.com e fontes espaciais verificadas."},ron:{timeline:"Bare albastre = total lunar de alerte. Linie portocalie = articole din surse științifice de încredere pe un al doilea ax.",sentiment:"Sentimentul este evaluat printr-o metodă de punctare bazată pe cuvinte cheie (nu IA). Cuvintele asociate cu oportunitate științifică, descoperire și misiuni împing scorul spre +1; limbajul de amenințare, pericol și risc de impact îl împing spre −1.<br><br><strong>Pozitiv (scor > 0.1):</strong> Articole care subliniază oportunitatea sau descoperirea — anunțuri de misiuni (ESA RAMSES, OSIRIS-APEX), descoperiri științifice, planificarea returnării de mostre.<br><strong>Negativ (scor < −0.1):</strong> Articole dominate de limbaj de pericol sau amenințare — actualizări de probabilitate de impact, avertismente de apropiere, cadraj apocaliptic.<br><strong>Neutru (−0.1 la 0.1):</strong> Raportare factuală descriptivă — date orbitale, confirmări de observatoare, conținut educativ general. Majoritatea acoperirii se încadrează aici.<br><br>Valoarea <strong>Sentiment mediu</strong> din antetul tabloului de bord reprezintă media tuturor scorurilor. Pe o scară de la −1 la +1, valorile între −0.1 și +0.1 sunt neutre. Media corpusului de <strong>0.07</strong> este ferm neutră cu o ușoară tendință pozitivă — articolele științifice și de descoperire le depășesc ușor pe cele axate pe amenințare. Un semnal pozitiv: mass-media tratează Apophis ca subiect științific, nu ca o amenințare apocaliptică.",source:"Date colectate din <strong>2 aprilie 2024</strong> (prima alertă capturată) prin două sisteme RSS în paralel.<br><br><strong>Google Alerts:</strong> 1.591 alerte → 5.960 articole. RSS declanșat de cuvinte cheie, monitorizând web-ul deschis și principalele surse media.<br><strong>Talkwalker:</strong> 686 alerte → 22.990 articole. Monitorizare mai largă a rețelelor sociale și fluxurilor de știri globale.<br><br>Cuvinte cheie configurate: <em>Apophis</em> · <em>Asteroid Apophis</em> · <em>99942 Apophis</em>.",nested:"Inel exterior = categorie sursă. Inel interior = tip articol în fiecare categorie.",publishers:"Scară logaritmică pe axa X — X (Twitter) are singur ~23.000 de articole.",language:"Limba a fost detectată automat cu <strong>franc-min</strong>, o bibliotecă statistică bazată pe trigrami (nu IA) care compară frecvențele trigramelor de caractere cu profile de referință pe limbă. Articolele scurte (< 50 cuvinte) pot fi clasificate greșit.<br><br>Setul de date conține <strong>60 de limbi unice</strong>. Graficul arată primele 12, acoperind 26.817 articole (92,6% din tot conținutul). Celelalte 48 de limbi reprezintă 2.133 de articole (7,4%).<br><br><strong>Limbi notabile nereprezentate:</strong> Malaeziană (200) · Japoneză (193) · Rusă (184) · Maghiară (176) · Indoneziană (167) · Neerlandeză (158) · Vietnameză (116) · Suedeză (95) · Sârbă (94) · Hindi (76) · Persană (71) · Bulgară (68) · și 36 altele.",density:"Câte articole a conținut fiecare alertă. Scala log revelează distribuția completă.",quality:"Scor euristic 1–10: număr cuvinte, scriere cu majuscule, absența clickbait. 8–10 = substanțial. 1–3 = scurt sau auto-generat.",sent_trend:"Media lunară a scorului de sentiment (−1 = foarte negativ, +1 = foarte pozitiv). Axa Y este scalată la intervalul real al datelor. Puncte verzi = lună pozitivă; roșii = negativă; galbene = neutră. Vârfurile pozitive coincid cu anunțuri de misiuni; cele negative cu actualizări de risc de impact.",variants:"'99942 Apophis' este denumirea formală UAI. 'Asteroid Apophis' apare în titluri.",science:"Acoperire de la NASA, ESA (misiunea RAMSES), JAXA, AAS, Space.com și surse spațiale verificate."},deu:{timeline:"Blaue Balken = monatliche Gesamtwarnungen. Orangefarbene Linie = Artikel aus vertrauenswürdigen Wissenschaftsquellen auf einer zweiten Achse.",sentiment:"Das Sentiment wird durch eine schlüsselwortbasierte Bewertungsmethode (keine KI) beurteilt. Wörter, die mit wissenschaftlicher Chance, Entdeckung und Missionen verbunden sind, schieben den Score Richtung +1; Bedrohungs-, Gefahr- und Einschlagsrisiko-Sprache schieben ihn Richtung −1.<br><br><strong>Positiv (Score > 0.1):</strong> Artikel, die Chancen oder Entdeckungen betonen — Missionsankündigungen (ESA RAMSES, OSIRIS-APEX), wissenschaftliche Erkenntnisse, Probenrückführungsplanung.<br><strong>Negativ (Score < −0.1):</strong> Artikel, die mit Gefahr- oder Bedrohungssprache aufmachen — Einschlagswahrscheinlichkeits-Updates, Warnungen zu Vorbeiflügen, Weltuntergangsrahmen.<br><strong>Neutral (−0.1 bis 0.1):</strong> Beschreibende sachliche Berichterstattung — Orbitaldaten, Observatoriumsbestätigungen, allgemeiner Bildungsinhalt. Die Mehrheit der Berichterstattung fällt hier rein.<br><br>Der <strong>Durchschn. Sentiment</strong>-Wert im Dashboard-Header ist der Mittelwert aller Artikelscores. Auf einer Skala von −1 bis +1 sind Werte zwischen −0.1 und +0.1 neutral. Der Corpus-Durchschnitt von <strong>0.07</strong> liegt fest im neutralen Bereich mit leicht positivem Trend — wissenschaftliche und entdeckungsorientierte Artikel überwiegen knapp gegenüber bedrohungsorientierten. Ein positives Signal: Die Medien behandeln Apophis als wissenschaftliches Thema, nicht als Weltuntergangsbedrohung.",source:"Daten gesammelt seit <strong>2. April 2024</strong> (erste erfasste Warnung) über zwei parallele RSS-Monitoring-Pipelines.<br><br><strong>Google Alerts:</strong> 1.591 Warnungen → 5.960 Artikel. Schlüsselwort-ausgelöste RSS-Überwachung des offenen Webs und wichtiger Nachrichtenquellen.<br><strong>Talkwalker:</strong> 686 Warnungen → 22.990 Artikel. Breitere Überwachung sozialer Medien und globaler Nachrichtenströme.<br><br>Konfigurierte Schlüsselwörter: <em>Apophis</em> · <em>Asteroid Apophis</em> · <em>99942 Apophis</em>.",nested:"Äußerer Ring = Quellkategorie. Innerer Ring = Artikeltyp innerhalb jeder Kategorie.",publishers:"Logarithmische Skala auf der X-Achse — X (Twitter) allein hat ~23.000 Artikel.",language:"Sprache automatisch erkannt mit <strong>franc-min</strong>, einer trigramm-basierten Statistikbibliothek (keine KI), die Zeichentrigramm-Häufigkeiten mit Referenzprofilen pro Sprache vergleicht. Kurze Artikel (< 50 Wörter) können fehlklassifiziert werden.<br><br>Der Datensatz enthält <strong>60 eindeutige Sprachen</strong>. Dieses Diagramm zeigt die 12 häufigsten, die 26.817 Artikel (92,6 % aller Inhalte) abdecken. Die restlichen 48 Sprachen machen 2.133 Artikel (7,4 %) aus.<br><br><strong>Bemerkenswerte nicht dargestellte Sprachen:</strong> Malaiisch (200) · Japanisch (193) · Russisch (184) · Ungarisch (176) · Indonesisch (167) · Niederländisch (158) · Vietnamesisch (116) · Schwedisch (95) · Serbisch (94) · Hindi (76) · Persisch (71) · Bulgarisch (68) · und 36 weitere.",density:"Wie viele Artikel jede Warnung enthielt. Die Log-Skala zeigt die vollständige Verteilung.",quality:"Heuristischer 1–10-Score: Wortzahl, Großschreibung, fehlende Clickbait-Marker. 8–10 = substantiell. 1–3 = kurz oder automatisch erstellt.",sent_trend:"Monatlicher Durchschnitt des Sentimentscores (−1 = sehr negativ, +1 = sehr positiv). Die Y-Achse ist auf den tatsächlichen Datenbereich skaliert. Grüne Punkte = positiver Monat; rote = negativ; gelbe = neutral. Positive Spitzen korrelieren mit Missionsankündigungen; negative Einbrüche mit Einschlagsrisiko-Updates.",variants:"'99942 Apophis' ist die formale IAU-Bezeichnung. 'Asteroid Apophis' erscheint in Schlagzeilen.",science:"Berichterstattung von NASA, ESA (RAMSES-Mission), JAXA, AAS, Space.com und verifizierten Raumfahrtquellen."},ita:{timeline:"Barre blu = totale avvisi mensili. Linea arancione = articoli da fonti scientifiche affidabili su un secondo asse.",sentiment:"Il sentiment è valutato mediante un metodo di punteggio basato su parole chiave (non IA). Le parole associate a opportunità scientifica, scoperta e missioni spingono il punteggio verso +1; il linguaggio di minaccia, pericolo e rischio di impatto lo spinge verso −1.<br><br><strong>Positivo (punteggio > 0.1):</strong> Articoli che enfatizzano opportunità o scoperta — annunci di missioni (ESA RAMSES, OSIRIS-APEX), scoperte scientifiche, pianificazione del ritorno dei campioni.<br><strong>Negativo (punteggio < −0.1):</strong> Articoli dominati da linguaggio di pericolo o minaccia — aggiornamenti sulla probabilità di impatto, avvertimenti di avvicinamento, inquadramento apocalittico.<br><strong>Neutro (−0.1 a 0.1):</strong> Reportage fattuale descrittivo — dati orbitali, conferme degli osservatori, contenuto educativo generale. La maggior parte della copertura rientra qui.<br><br>Il valore <strong>Sentiment medio</strong> nell'intestazione del dashboard è la media di tutti i punteggi. Su una scala da −1 a +1, i valori tra −0.1 e +0.1 sono neutri. La media del corpus di <strong>0.07</strong> è fermamente neutra con una lieve tendenza positiva — gli articoli scientifici e di scoperta superano leggermente quelli focalizzati sulla minaccia. Un segnale positivo: i media trattano Apophis come argomento scientifico, non come minaccia apocalittica.",source:"Dati raccolti dal <strong>2 aprile 2024</strong> (primo avviso catturato) tramite due pipeline RSS in parallelo.<br><br><strong>Google Alerts:</strong> 1.591 avvisi → 5.960 articoli. RSS attivato da parole chiave che monitora il web aperto e i principali media.<br><strong>Talkwalker:</strong> 686 avvisi → 22.990 articoli. Monitoraggio più ampio dei social media e dei flussi di notizie globali.<br><br>Parole chiave configurate: <em>Apophis</em> · <em>Asteroid Apophis</em> · <em>99942 Apophis</em>.",nested:"Anello esterno = categoria sorgente. Anello interno = tipo di articolo in ogni categoria.",publishers:"Scala logaritmica sull'asse X — X (Twitter) da solo ha ~23.000 articoli.",language:"Lingua rilevata automaticamente con <strong>franc-min</strong>, una libreria statistica basata su trigrammi (non IA) che confronta le frequenze dei trigrammi di caratteri con i profili di riferimento per lingua. Gli articoli brevi (< 50 parole) possono essere classificati erroneamente.<br><br>Il dataset contiene <strong>60 lingue uniche</strong>. Questo grafico mostra le prime 12, che coprono 26.817 articoli (92,6% di tutti i contenuti). Le restanti 48 lingue rappresentano 2.133 articoli (7,4%).<br><br><strong>Lingue notevoli non rappresentate:</strong> Malese (200) · Giapponese (193) · Russo (184) · Ungherese (176) · Indonesiano (167) · Olandese (158) · Vietnamita (116) · Svedese (95) · Serbo (94) · Hindi (76) · Persiano (71) · Bulgaro (68) · e altri 36.",density:"Quanti articoli conteneva ogni avviso. La scala log rivela la distribuzione completa.",quality:"Punteggio euristico 1–10: conteggio parole, capitalizzazione, assenza di clickbait. 8–10 = sostanziale. 1–3 = breve o auto-generato.",sent_trend:"Media mensile del punteggio di sentiment (−1 = molto negativo, +1 = molto positivo). L'asse Y è scalato all'intervallo reale dei dati. Punti verdi = mese netto positivo; rossi = negativo; gialli = neutro. I picchi positivi coincidono con annunci di missioni; i cali negativi con aggiornamenti sul rischio di impatto.",variants:"'99942 Apophis' è la designazione formale IAU. 'Asteroide Apophis' appare nei titoli.",science:"Copertura di NASA, ESA (missione RAMSES), JAXA, AAS, Space.com e fonti spaziali verificate."},jpn:{timeline:"青いバー＝月別アラート総数。オレンジの線＝信頼できる科学ソースの記事（第2軸）。スパイクは軌道計算の重要な更新を示す。",sentiment:"感情スコアはキーワードベースの評価手法（AIではなく）で算出。科学的機会・発見・ミッションに関連する語が+1方向へ押し上げ、脅威・危険・衝突リスクの語が−1方向へ引き下げます。各記事のスコアはマッチした語の加重平均。<br><br><strong>ポジティブ（スコア > 0.1）：</strong>機会や発見を強調する記事 — ミッション発表（ESA RAMSES・OSIRIS-APEX）、科学的成果、サンプルリターン計画。<br><strong>ネガティブ（スコア < −0.1）：</strong>危険・脅威の言語が前面に出た記事 — 衝突確率の更新、接近警告、終末論的な枠組み。<br><strong>ニュートラル（−0.1〜0.1）：</strong>客観的な事実報告 — 軌道データの公開、観測所の確認、一般的な教育コンテンツ。大部分の報道はここに含まれる。<br><br>ダッシュボードヘッダーの<strong>平均感情スコア</strong>は全記事スコアの平均値。−1〜+1のスケールで、−0.1〜+0.1は中立。コーパス平均<strong>0.07</strong>は中立域にしっかり収まり、わずかにポジティブ寄り — 科学・発見系の記事が脅威系をわずかに上回る結果。健全なシグナル：メディアはApophisを終末的脅威ではなく科学的テーマとして報道している。",source:"データは<strong>2024年4月2日</strong>（最初に取得したアラート）以来、2つの並行RSSモニタリングシステムで収集。<br><br><strong>Google Alerts：</strong>1,591件のアラート → 5,960記事。キーワードで起動するRSSでオープンウェブと主要ニュースを監視。<br><strong>Talkwalker：</strong>686件のアラート → 22,990記事。SNS・グローバルニュースをより広範囲に監視し、1アラートあたりの記事数が多い。<br><br>設定キーワード：<em>Apophis</em> · <em>Asteroid Apophis</em> · <em>99942 Apophis</em>。",nested:"外側のリング＝ソースカテゴリ。内側のリング＝各カテゴリのタイプ。",publishers:"X軸は対数スケール。X(Twitter)だけで約23,000記事。",language:"言語は<strong>franc-min</strong>（AIではなく、文字トライグラム統計ライブラリ）で自動検出。記事の文字トライグラム頻度を言語ごとの参照プロファイルと比較。短い記事（50語未満）は誤分類の可能性あり。<br><br>データセットには<strong>60の固有言語</strong>が含まれる。このグラフは上位12言語を示し、26,817記事（全コンテンツの92.6%）をカバー。残り48言語は2,133記事（7.4%）。<br><br><strong>未表示の注目言語（記事数）：</strong>マレー語(200)・日本語(193)・ロシア語(184)・ハンガリー語(176)・インドネシア語(167)・オランダ語(158)・ベトナム語(116)・スウェーデン語(95)・セルビア語(94)・ヒンディー語(76)・ペルシャ語(71)・ブルガリア語(68)・その他36言語。",density:"1アラートあたりの記事数。対数スケールで全分布を表示。",quality:"品質スコア1〜10：文字数・見出し表記・クリックベイト語句の有無。8〜10＝充実した記事。1〜3＝短い／自動生成。",sent_trend:"月別感情スコアの平均（−1＝非常にネガティブ、+1＝非常にポジティブ）。Y軸は実際のデータ範囲にスケーリング。緑点＝ポジティブな月、赤点＝ネガティブな月、黄点＝ニュートラル。ポジティブなスパイクはミッション発表と相関。",variants:"「99942 Apophis」はIAUの正式名称。「Asteroid Apophis」は見出しで使用。「Apophis」は略称。",science:"NASA、ESA（RAMSESミッション）、JAXA、AAS、Space.comなど検証済みの宇宙科学ソース。"}};function C(i,e){var t;return((t=oo[i])==null?void 0:t[e])??oo.eng[e]??""}const ro={eng:{intro1:"This dashboard collects, analyzes, and visualizes media coverage of asteroid <strong>99942 Apophis</strong> — one of the most closely watched near-Earth objects in history. It processes thousands of email alerts from Google Alerts and Talkwalker into a structured, searchable, and chartable dataset.",intro2:"No machine learning APIs were used. All analysis runs locally on your data, in your browser.",sentiment_text:"A number between −1 (very negative) and +1 (very positive) that reflects the emotional tone of each article. Positive articles tend to focus on <em>scientific opportunity</em> — missions, observations, discoveries. Negative articles emphasize <em>threat language</em> — collision, danger, impact, doomsday. Most coverage is neutral (near zero), especially from scientific outlets. This score is keyword-based, not AI-generated — treat it as a rough signal, not a precise measurement.",quality_text:'A score from 1–10 estimating how carefully an article was written. It considers: word count (longer tends to be better), proper title casing, absence of clickbait phrases (like "SHOCKING" or "MUST READ"), and basic sentence structure. A score of 8–10 indicates a substantive, well-crafted piece. A score of 1–3 suggests a brief, clickbait-style, or auto-generated article. This score does <em>not</em> evaluate factual accuracy.',trusted_text:'The "Trusted Science &amp; Space Sources" chart highlights coverage from known reliable science and space-science publishers: NASA, JAXA, ESA, AAS, Space.com, Spaceflight Now, Universe Today, Sky &amp; Telescope, arXiv, Science Alert, and others. These are weighted against the overall media noise.',get_data_intro:"To run this pipeline with your own Gmail alerts:",step1:'In Gmail, apply a label to your alert emails (e.g. "Apophis")',step2:'Go to <a href="https://takeout.google.com" target="_blank" rel="noopener">Google Takeout</a>',step3:"Select <strong>Mail</strong> only, then choose <strong>Select labels</strong> and pick your label",step4:"Download the archive — it will contain an <code>Apophis.mbox</code> file",step5:"Place it at <code>[YOUR_PROJECT]/Takeout/Mail/Apophis.mbox</code>",step6:"Run the parser (see the source code for instructions)",code_intro:"This project is written entirely in <strong>TypeScript</strong>, runs on <strong>Bun</strong>, and produces a single self-contained <code>index.html</code> via Vite. No Python. No external APIs. No personal data in the source.",desc_parse:"reads the mbox, creates email folders, extracts articles, writes JSON",desc_extractors:"parses Google Alerts JSON blob and Talkwalker HTML links",desc_utils:"language detection, sentiment, publisher cleanup, geo lookup",desc_schema:"Zod schema shared between parser and dashboard",desc_app:"Vite + TypeScript dashboard source",dl_label:"⬇ Download all source files — edit paths to match your setup"},spa:{intro1:"Este panel recopila, analiza y visualiza la cobertura mediática del asteroide <strong>99942 Apophis</strong> — uno de los objetos cercanos a la Tierra más seguidos de la historia. Procesa miles de alertas de Google Alerts y Talkwalker en un conjunto de datos estructurado, con capacidad de búsqueda y visualización.",intro2:"No se usaron APIs de machine learning. Todo el análisis corre localmente en tu navegador.",sentiment_text:"Un número entre −1 (muy negativo) y +1 (muy positivo) que refleja el tono emocional de cada artículo. Los artículos positivos tienden a centrarse en <em>oportunidades científicas</em> — misiones, observaciones, descubrimientos. Los negativos enfatizan <em>lenguaje de amenaza</em> — colisión, peligro, impacto, catástrofe. La mayoría de la cobertura es neutral (cerca de cero). Esta puntuación es basada en palabras clave, no generada por IA.",quality_text:'Una puntuación del 1 al 10 que estima con qué cuidado fue escrito un artículo. Considera: recuento de palabras, uso de mayúsculas correcto, ausencia de frases clickbait (como "IMPACTANTE") y estructura básica de oraciones. Un puntaje de 8–10 indica una pieza sustancial y bien elaborada. Un puntaje de 1–3 sugiere un artículo breve, clickbait o autogenerado. Esta puntuación no evalúa la precisión factual.',trusted_text:'El gráfico "Fuentes Científicas Confiables" destaca la cobertura de publicaciones confiables: NASA, JAXA, ESA, AAS, Space.com, Spaceflight Now, Universe Today, Sky &amp; Telescope, arXiv, Science Alert y otros.',get_data_intro:"Para ejecutar este proceso con tus propias alertas de Gmail:",step1:'En Gmail, aplica una etiqueta a tus correos de alertas (ej. "Apophis")',step2:'Ve a <a href="https://takeout.google.com" target="_blank" rel="noopener">Google Takeout</a>',step3:"Selecciona solo <strong>Correo</strong>, luego elige <strong>Seleccionar etiquetas</strong>",step4:"Descarga el archivo — contendrá un fichero <code>Apophis.mbox</code>",step5:"Colócalo en <code>[TU_PROYECTO]/Takeout/Mail/Apophis.mbox</code>",step6:"Ejecuta el analizador
